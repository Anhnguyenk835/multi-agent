receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/langfuse:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(span.attributes["langfuse.observation.type"], "span") where resource.attributes["service.name"] == "litellm-gateway" and span.attributes["http.route"] != nil
          - set(span.attributes["langfuse.observation.type"], "span") where resource.attributes["service.name"] != "litellm-gateway" and span.attributes["gen_ai.operation.name"] != nil
          - set(span.attributes["langfuse.observation.type"], "generation") where resource.attributes["service.name"] == "litellm-gateway" and span.attributes["gen_ai.operation.name"] != nil
          - set(span.attributes["langfuse.observation.model.name"], span.attributes["litellm.provider.model"]) where resource.attributes["service.name"] == "litellm-gateway" and span.attributes["litellm.provider.model"] != nil
          - set(span.attributes["gen_ai.usage.cost"], span.attributes["litellm.cost.total"]) where resource.attributes["service.name"] == "litellm-gateway" and span.attributes["litellm.cost.total"] != nil
          - delete_matching_keys(span.attributes, "^gen_ai\\.usage\\.") where resource.attributes["service.name"] != "litellm-gateway"
  filter/noisy_framework_spans:
    error_mode: ignore
    traces:
      span:
        - attributes["asgi.event.type"] != nil
        - attributes["rpc.service"] == "grpc.health.v1.Health"
        - attributes["http.request.method"] == "OPTIONS" or attributes["http.method"] == "OPTIONS"
        - resource.attributes["service.name"] == "litellm-gateway" and attributes["db.system.name"] != nil
        - resource.attributes["service.name"] == "litellm-gateway" and IsMatch(name, "^auth /")
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_BASE_URL:-https://cloud.langfuse.com}/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s

extensions:
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [basicauth/langfuse, health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/noisy_framework_spans, transform/langfuse, batch]
      exporters: [otlphttp/langfuse]
