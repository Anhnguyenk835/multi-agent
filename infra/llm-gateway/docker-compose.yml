# Started from the LiteLLM quickstart fetched with:
#   curl -sSLO https://docs.litellm.ai/docker-compose.yml
# Project-specific settings below provide a version pin, real credentials from
# .env, Redis-backed coordination, logical-model routes, and a localhost-only
# diagnostic port.
services:
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.98.0
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      REDIS_SSL_CA_CERTS: ""
      STORE_MODEL_IN_DB: "False"
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --telemetry
      - "False"
      - --use_v2_migration_resolver
      - --enforce_prisma_migration_check
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.7-alpine
    env_file:
      - .env
    command:
      - sh
      - -ec
      - >-
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD must be set}";
        exec redis-server --requirepass "$${REDIS_PASSWORD}" --dir /data
        --appendonly yes --appendfsync everysec --save 900 1 --save 300 10
        --save 60 10000
    volumes:
      - litellm-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  litellm-postgres-data:
  litellm-redis-data:
