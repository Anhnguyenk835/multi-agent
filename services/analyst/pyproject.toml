[project]
name = "analyst"
version = "0.1.0"
description = "LangChain analysis service"
requires-python = ">=3.12"
dependencies = [
    "distributed-agent-contracts",
    "fastapi>=0.115.0",
    "groq>=1.7.0",
    "langsmith>=0.11.0",
    "openai>=1.54.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.32.0",
]

[tool.uv.sources]
distributed-agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
