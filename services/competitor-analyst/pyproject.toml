[project]
name = "competitor-analyst"
version = "0.1.0"
description = "Google ADK competitor-analysis gRPC agent"
requires-python = ">=3.12"
dependencies = [
    "distributed-agent-contracts",
    "google-adk[extensions]>=1.0.0",
    "exa-py>=1.9.0",
    "grpcio>=1.68.0",
    "grpcio-health-checking>=1.68.0",
    "langsmith>=0.11.0",
    "openai>=1.54.0",
    "opentelemetry-api>=1.39.0,<2",
    "opentelemetry-distro>=0.60b0,<1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0,<2",
    "opentelemetry-instrumentation-grpc>=0.60b0,<1",
    "opentelemetry-instrumentation-httpx>=0.60b0,<1",
    "opentelemetry-sdk>=1.39.0,<2",
    "protobuf>=7.35.1",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
distributed-agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
