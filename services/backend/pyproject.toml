[project]
name = "backend"
version = "0.1.0"
description = "Dashboard read API for saved market intelligence"
requires-python = ">=3.12"
dependencies = [
    "distributed-agent-contracts",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.0",
]

[tool.uv.sources]
distributed-agent-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
