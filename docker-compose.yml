name: distributed-agents-demo

include:
  - path: ./infra/llm-gateway/docker-compose.yml

services:
  dashboard-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_USER: dashboard
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - dashboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-migrate:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "backend.migrate"]
    environment:
      BACKEND_DATABASE_URL: postgresql://dashboard:dashboard@dashboard-postgres:5432/dashboard
    depends_on:
      dashboard-postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      BACKEND_ALLOWED_ORIGINS: http://localhost:5173
      BACKEND_DATABASE_URL: postgresql://dashboard:dashboard@dashboard-postgres:5432/dashboard
      BACKEND_INTERNAL_API_TOKEN: ${BACKEND_INTERNAL_API_TOKEN:-local-market-analyst}
      MARKET_ANALYST_BASE_URL: http://market-analyst:8001
      MARKET_REPORT_ANALYST_ASSISTANT_ID: market_report_analyst
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    env_file:
      - path: infra/observability/.env
        required: false
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 3s
      retries: 3

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    env_file:
      - services/orchestrator/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.1.0
      OTEL_SERVICE_NAME: orchestrator
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /health,/ready
      ANALYST_URL: http://analyst:8002
      CHECKPOINT_DATABASE_URL: postgresql://distributed_agents:distributed_agents@postgres:5432/distributed_agents?sslmode=disable
      ANALYST_BACKOFF_SECONDS: ${ORCHESTRATOR_ANALYST_BACKOFF_SECONDS:-0.1}
      ANALYST_MAX_ATTEMPTS: ${ORCHESTRATOR_ANALYST_MAX_ATTEMPTS:-2}
      ANALYST_TIMEOUT_SECONDS: ${ORCHESTRATOR_ANALYST_TIMEOUT_SECONDS:-90}
      COMPETITOR_ANALYST_ADDRESS: competitor-analyst:50051
      COMPETITOR_ANALYST_BACKOFF_SECONDS: ${ORCHESTRATOR_COMPETITOR_ANALYST_BACKOFF_SECONDS:-0.1}
      COMPETITOR_ANALYST_MAX_ATTEMPTS: ${ORCHESTRATOR_COMPETITOR_ANALYST_MAX_ATTEMPTS:-2}
      COMPETITOR_ANALYST_TIMEOUT_SECONDS: ${ORCHESTRATOR_COMPETITOR_ANALYST_TIMEOUT_SECONDS:-300}
      MARKET_ANALYST_BACKOFF_SECONDS: ${ORCHESTRATOR_MARKET_ANALYST_BACKOFF_SECONDS:-0.1}
      MARKET_ANALYST_MAX_ATTEMPTS: ${ORCHESTRATOR_MARKET_ANALYST_MAX_ATTEMPTS:-2}
      MARKET_ANALYST_TIMEOUT_SECONDS: ${ORCHESTRATOR_MARKET_ANALYST_TIMEOUT_SECONDS:-90}
      MARKET_ANALYST_URL: http://market-analyst:8001
      WRITER_BACKOFF_SECONDS: ${ORCHESTRATOR_WRITER_BACKOFF_SECONDS:-0.1}
      WRITER_MAX_ATTEMPTS: ${ORCHESTRATOR_WRITER_MAX_ATTEMPTS:-2}
      WRITER_TIMEOUT_SECONDS: ${ORCHESTRATOR_WRITER_TIMEOUT_SECONDS:-90}
      WRITER_URL: http://writer:8003
    ports:
      - "8000:8000"
    depends_on:
      otel-collector:
        condition: service_started
      market-analyst:
        condition: service_healthy
      competitor-analyst:
        condition: service_healthy
      analyst:
        condition: service_healthy
      writer:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: distributed_agents
      POSTGRES_PASSWORD: distributed_agents
      POSTGRES_USER: distributed_agents
    ports:
      - "5434:5432"
    volumes:
      - orchestrator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distributed_agents -d distributed_agents"]
      interval: 5s
      timeout: 3s
      retries: 10

  market-analyst:
    build:
      context: .
      dockerfile: services/market-analyst/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - services/market-analyst/.env
    environment:
      # primary + retry + fallback + fallback retry in LiteLLM
      LLM_GATEWAY_MAX_PROVIDER_ATTEMPTS: "4"
      LLM_GATEWAY_BASE_URL: http://litellm:4000/v1
      LLM_MAX_OUTPUT_TOKENS: "8000"
      BACKEND_BASE_URL: http://backend:8010
      BACKEND_INTERNAL_API_TOKEN: ${BACKEND_INTERNAL_API_TOKEN:-local-market-analyst}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.1.0
      OTEL_SERVICE_NAME: market-analyst
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /ok
    depends_on:
      otel-collector:
        condition: service_started
      litellm:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ok')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  competitor-analyst:
    build:
      context: .
      dockerfile: services/competitor-analyst/Dockerfile
    ports:
      - "50051:50051"
    env_file:
      - services/competitor-analyst/.env
    environment:
      DEMO_FAILURE_DELAY_MS: ${COMPETITOR_ANALYST_FAILURE_DELAY_MS:-250}
      DEMO_FAILURE_MODE: ${COMPETITOR_ANALYST_FAILURE_MODE:-none}
      # primary + retry + fallback + fallback retry in LiteLLM
      LLM_GATEWAY_MAX_PROVIDER_ATTEMPTS: "4"
      LLM_GATEWAY_BASE_URL: http://litellm:4000/v1
      LLM_MAX_OUTPUT_TOKENS: "8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.1.0
      OTEL_SERVICE_NAME: competitor-analyst
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: parentbased_always_on
    depends_on:
      otel-collector:
        condition: service_started
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--package", "competitor-analyst", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; channel = grpc.insecure_channel('localhost:50051'); response = health_pb2_grpc.HealthStub(channel).Check(health_pb2.HealthCheckRequest(), timeout=2); assert response.status == health_pb2.HealthCheckResponse.SERVING"]
      interval: 10s
      timeout: 3s
      retries: 3

  analyst:
    build:
      context: .
      dockerfile: services/analyst/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - services/analyst/.env
    environment:
      DEMO_FAILURE_DELAY_MS: ${ANALYST_FAILURE_DELAY_MS:-250}
      DEMO_FAILURE_MODE: ${ANALYST_FAILURE_MODE:-none}
      # primary + retry + fallback + fallback retry in LiteLLM
      LLM_GATEWAY_MAX_PROVIDER_ATTEMPTS: "4"
      LLM_GATEWAY_BASE_URL: http://litellm:4000/v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.1.0
      OTEL_SERVICE_NAME: analyst
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /health,/ready
    depends_on:
      otel-collector:
        condition: service_started
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3

  writer:
    build:
      context: .
      dockerfile: services/writer/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - services/writer/.env
    environment:
      DEMO_FAILURE_DELAY_MS: ${WRITER_FAILURE_DELAY_MS:-250}
      DEMO_FAILURE_MODE: ${WRITER_FAILURE_MODE:-none}
      # primary + retry + fallback + fallback retry in LiteLLM
      LLM_GATEWAY_MAX_PROVIDER_ATTEMPTS: "4"
      LLM_GATEWAY_BASE_URL: http://litellm:4000/v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=0.1.0
      OTEL_SERVICE_NAME: writer
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /health,/ready
    depends_on:
      otel-collector:
        condition: service_started
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  dashboard-postgres-data:
  orchestrator-postgres-data:
