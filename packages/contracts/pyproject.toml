description = "Shared contracts for the distributed-agent demo"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.83.1",
    "pydantic>=2.10.0",
    "protobuf>=7.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
