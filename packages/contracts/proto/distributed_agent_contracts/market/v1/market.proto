syntax = "proto3";

package distributed_agents.market.v1;

message RequestMetadata {
  string contract_version = 1;
  string request_id = 2;
  string trace_id = 3;
  int32 attempt = 4;
  int64 deadline_unix_ms = 5;
}

enum ResponseStatus {
  RESPONSE_STATUS_UNSPECIFIED = 0;
  RESPONSE_STATUS_SUCCESS = 1;
  RESPONSE_STATUS_DEGRADED = 2;
  RESPONSE_STATUS_FAILED = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VALIDATION_ERROR = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  ERROR_CODE_UPSTREAM_UNAVAILABLE = 5;
  ERROR_CODE_UPSTREAM_INVALID_RESPONSE = 6;
  ERROR_CODE_RATE_LIMITED = 7;
  ERROR_CODE_WORKFLOW_ABORTED = 8;
  ERROR_CODE_INTERNAL_ERROR = 9;
}

message ContractError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

message Source {
  string title = 1;
  string url = 2;
  string publisher = 3;
  int64 published_at_unix_ms = 4;
  int64 retrieved_at_unix_ms = 5;
  // Full page text. Only used between Market Agent and Orchestrator/Analyst;
  // never forwarded past Analyst.
  string content = 6;
}

message MarketSignal {
  string topic = 1;
  string observation = 2;
  Source source = 3;
}

message MarketRequest {
  RequestMetadata metadata = 1;
  string query = 2;
}

message MarketResponse {
  RequestMetadata metadata = 1;
  ResponseStatus status = 2;
  repeated MarketSignal market_signals = 3;
  repeated string competitors = 4;
  repeated string warnings = 5;
  ContractError error = 6;
}

service MarketAgent {
  rpc AnalyzeMarket(MarketRequest) returns (MarketResponse);
}
