syntax = "proto3";

package distributed_agents.competitor.v1;

message RequestMetadata {
  string contract_version = 1;
  string request_id = 2;
  string trace_id = 3;
  int32 attempt = 4;
  int64 deadline_unix_ms = 5;
}

enum ResponseStatus {
  RESPONSE_STATUS_UNSPECIFIED = 0;
  RESPONSE_STATUS_SUCCESS = 1;
  RESPONSE_STATUS_DEGRADED = 2;
  RESPONSE_STATUS_FAILED = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VALIDATION_ERROR = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  ERROR_CODE_UPSTREAM_UNAVAILABLE = 5;
  ERROR_CODE_UPSTREAM_INVALID_RESPONSE = 6;
  ERROR_CODE_RATE_LIMITED = 7;
  ERROR_CODE_WORKFLOW_ABORTED = 8;
  ERROR_CODE_INTERNAL_ERROR = 9;
}

message ContractError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

message Source {
  string title = 1;
  string url = 2;
  string publisher = 3;
  int64 published_at_unix_ms = 4;
  int64 retrieved_at_unix_ms = 5;
  // Full page text. Only used between Competitor Analyst and Orchestrator/Analyst;
  // never forwarded past Analyst.
  string content = 6;
}

message CompetitiveSignal {
  string topic = 1;
  string observation = 2;
  Source source = 3;
}

message EvidenceClaim {
  string text = 1;
  repeated string source_ids = 2;
}

message CompetitorPricing {
  string model = 1;
  optional double annual_price = 2;
  string currency = 3;
  repeated string source_ids = 4;
}

message CompetitorProfile {
  string id = 1;
  string name = 2;
  string type = 3;
  EvidenceClaim positioning = 4;
  repeated EvidenceClaim target_segments = 5;
  repeated EvidenceClaim jobs_to_be_done = 6;
  repeated EvidenceClaim platforms = 7;
  CompetitorPricing pricing = 8;
  repeated EvidenceClaim features = 9;
  repeated EvidenceClaim traction_signals = 10;
  repeated EvidenceClaim review_themes = 11;
  repeated EvidenceClaim distribution_channels = 12;
  repeated EvidenceClaim retention_mechanics = 13;
  repeated EvidenceClaim strengths = 14;
  repeated EvidenceClaim weaknesses = 15;
  int32 confidence = 16;
  repeated string source_ids = 17;
}

message CompetitiveGap {
  string id = 1;
  string segment = 2;
  string unmet_need = 3;
  string competitor_coverage = 4;
  string demand_strength = 5;
  string commercial_signal = 6;
  int32 confidence = 7;
  repeated string source_ids = 8;
}

message CompetitorAnalysis {
  string competition_level = 1;
  string market_structure = 2;
  int32 tracked_products = 3;
  string feature_saturation = 4;
  string switching_cost = 5;
  repeated CompetitorProfile competitors = 6;
  repeated CompetitiveGap gaps = 7;
  int32 coverage = 8;
  repeated string source_ids = 9;
}

message EvidenceSource {
  string id = 1;
  string title = 2;
  string url = 3;
  string publisher = 4;
  int64 published_at_unix_ms = 5;
  int64 retrieved_at_unix_ms = 6;
  string content = 7;
}

message CompetitorAnalysisRequest {
  RequestMetadata metadata = 1;
  string query = 2;
}

message CompetitorAnalysisResponse {
  RequestMetadata metadata = 1;
  ResponseStatus status = 2;
  repeated CompetitiveSignal competitive_signals = 3;
  repeated string competitors = 4;
  repeated string warnings = 5;
  ContractError error = 6;
  CompetitorAnalysis analysis = 7;
  repeated EvidenceSource evidence = 8;
}

service CompetitorAnalyst {
  rpc AnalyzeCompetitors(CompetitorAnalysisRequest) returns (CompetitorAnalysisResponse);
}
